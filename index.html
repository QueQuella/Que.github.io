<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quella | Portfolio</title>
    <!-- 链接到我们即将创建的CSS文件 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 主容器，用于居中和对齐所有内容 -->
    <main class="container">
        <!-- 英雄区域：包含名字和标题 -->
        <section class="hero">
            <!-- 这个h1将实现打字机效果 -->
            <h1 class="typing-text" id="typing-name">Quella</h1>
            <!-- 这个h2也将实现打字机效果 -->
            <h2 class="typing-text" id="typing-title"></h2>
        </section>

        <!-- 作品集导航网格 -->
        <section class="portfolio-grid">
            <!-- 每个a标签代表一个板块，点击后会跳转到对应的页面 -->
            <a href="pages/3d-animation.html" class="portfolio-card">
                <h3>3D动画与场景设计</h3>
            </a>
            <a href="pages/game-design.html" class="portfolio-card">
                <h3>游戏设计</h3>
            </a>
            <a href="pages/graphic-illustration.html" class="portfolio-card">
                <h3>平面插画</h3>
            </a>
            <a href="pages/interactive-design.html" class="portfolio-card">
                <h3>交互设计</h3>
            </a>
            <a href="pages/exploration.html" class="portfolio-card">
                <h3>探索</h3>
            </a>
        </section>
    </main>

    <!-- 链接到我们即将创建的JavaScript文件 -->
    <script src="js/typing-effect.js"></script>
</body>
</html>
