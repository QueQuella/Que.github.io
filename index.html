<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quella | Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/typing-effect.css">
    <!-- 引入图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- 动态背景装饰 -->
    <div class="bg-dots"></div>
    <div class="bg-circles"></div>
    
    <main class="container">
        <!-- 英雄区域 -->
        <section class="hero">
            <div class="title-container">
                <h1 class="typing-text" id="main-title"></h1>
            </div>
            <p class="hero-subtitle">交互媒体设计师 · 创意开发者</p>
        </section>

        <!-- 作品集导航网格 -->
        <section class="portfolio-section">
            <h2 class="section-title">作品展示</h2>
            <div class="portfolio-grid">
                <a href="pages/3d-animation.html" class="portfolio-card hand-drawn-card">
                    <div class="card-icon">
                        <i class="fas fa-cube"></i>
                    </div>
                    <h3>3D动画与场景设计</h3>
                    <p>沉浸式三维体验创作</p>
                </a>
                
                <a href="pages/game-design.html" class="portfolio-card hand-drawn-card">
                    <div class="card-icon">
                        <i class="fas fa-gamepad"></i>
                    </div>
                    <h3>游戏设计</h3>
                    <p>互动叙事与玩法创新</p>
                </a>
                
                <a href="pages/graphic-illustration.html" class="portfolio-card hand-drawn-card">
                    <div class="card-icon">
                        <i class="fas fa-palette"></i>
                    </div>
                    <h3>平面插画</h3>
                    <p>视觉叙事与品牌设计</p>
                </a>
                
                <a href="pages/interactive-design.html" class="portfolio-card hand-drawn-card">
                    <div class="card-icon">
                        <i class="fas fa-mouse-pointer"></i>
                    </div>
                    <h3>交互设计</h3>
                    <p>用户体验与界面创新</p>
                </a>
                
                <a href="pages/exploration.html" class="portfolio-card hand-drawn-card">
                    <div class="card-icon">
                        <i class="fas fa-compass"></i>
                    </div>
                    <h3>探索</h3>
                    <p>实验性项目与跨界创作</p>
                </a>
                
                <!-- 新增简历模块 -->
                <a href="pages/resume.html" class="portfolio-card hand-drawn-card resume-card">
                    <div class="card-icon">
                        <i class="fas fa-file-alt"></i>
                    </div>
                    <h3>简历</h3>
                    <p>专业技能与项目经历</p>
                </a>
            </div>
        </section>
    </main>

    <script src="js/typing-effect.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
